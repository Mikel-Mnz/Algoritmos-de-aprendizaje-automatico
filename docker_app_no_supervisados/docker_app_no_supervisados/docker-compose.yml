services:
  modelos-no-supervisados:
    build: .
    image: modelos-no-supervisados:v1
    container_name: modelos_no_supervisados_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
